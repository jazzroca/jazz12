<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winwheel.js 룰렛</title>

  <!-- 룰렛 구동에 필요한 외부 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/zarockzz/Winwheel.js@2.8.0/Winwheel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: #f4f4f9;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .canvas-container {
      position: relative;
      width: min(400px, 92vw);
      aspect-ratio: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .pointer {
      position: absolute;
      z-index: 2;
      top: -4px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 34px solid #222;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
    }
    button {
      margin-top: 20px;
      padding: 12px 28px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #result { min-height: 26px; margin-top: 14px; font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="canvas-container">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="canvas" width="400" height="400">브라우저가 Canvas를 지원하지 않습니다.</canvas>
  </div>

  <button id="spinButton" type="button" onclick="startSpin()">룰렛 돌리기</button>
  <div id="result" aria-live="polite"></div>

  <script>
    const spinButton = document.getElementById('spinButton');
    const result = document.getElementById('result');

    const theWheel = new Winwheel({
      canvasId: 'canvas',
      numSegments: 4,
      outerRadius: 170,
      textFontSize: 18,
      segments: [
        { fillStyle: '#eae56f', text: '1등 당첨' },
        { fillStyle: '#89f26e', text: '다음 기회에' },
        { fillStyle: '#7de6ef', text: '2등 당첨' },
        { fillStyle: '#e7706c', text: '아쉬워요' }
      ],
      animation: {
        type: 'spinToStop',
        duration: 5,
        spins: 8,
        callbackFinished: showPrize
      }
    });

    function startSpin() {
      spinButton.disabled = true;
      result.textContent = '';
      theWheel.stopAnimation(false);
      theWheel.rotationAngle = 0;
      theWheel.draw();
      theWheel.startAnimation();
    }

    function showPrize(indicatedSegment) {
      const message = '결과: ' + indicatedSegment.text;
      result.textContent = message;
      spinButton.disabled = false;
      alert('축하합니다! ' + message);
    }
  </script>
</body>
</html>
