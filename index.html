<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Environmental Monitoring System</title>
<style>
:root{
 --bg:#06101d;--panel:#0b1a2b;--panel2:#0e2237;--line:#1e5270;--text:#dcecff;--muted:#7896ae;
 --normal:#35e6c2;--attention:#f1d34d;--warning:#ff9d3d;--abnormal:#ff5364;--offline:#718096;--cyan:#4fc8ff
}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#0c2940,#06101d 48%);
color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px}
button,input{font:inherit}.app{min-height:100vh;padding:14px 18px}
header{display:flex;align-items:center;justify-content:space-between;border:1px solid #174866;background:#081827e8;
padding:12px 16px;border-radius:8px;box-shadow:0 0 24px #00aaff14}
.brand{font-size:22px;font-weight:700;letter-spacing:.5px}.brand small{display:block;color:#6ebcdb;font-size:11px;margin-top:4px}
.controls{display:flex;gap:8px;align-items:center}.btn{border:1px solid #24617d;color:#bfeaff;background:#0b263a;padding:7px 11px;border-radius:5px;cursor:pointer}
.btn.active,.btn:hover{background:#124866}.clock{font-variant-numeric:tabular-nums;color:#9adfff}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:10px 0}.kpi{background:linear-gradient(180deg,#0c2033,#091724);
border:1px solid #19435c;border-radius:7px;padding:9px 12px;min-height:68px}.kpi .label{font-size:11px;color:#84a9bf;text-transform:uppercase}
.kpi .num{font-size:25px;font-weight:700;margin-top:5px}.kpi.normal .num{color:var(--normal)}.kpi.attention .num{color:var(--attention)}
.kpi.warning .num{color:var(--warning)}.kpi.abnormal .num{color:var(--abnormal)}.kpi.early .num{color:#ffc66d}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px}.section-title{font-weight:700;color:#9ddfff;margin:3px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:9px}.card{position:relative;background:linear-gradient(150deg,#0c2032,#081522);
border:1px solid #1b506e;border-left:4px solid var(--normal);border-radius:7px;padding:10px;cursor:pointer;overflow:hidden;transition:.15s}
.card:hover{transform:translateY(-1px);border-color:#42a6cf}.card.attention{border-left-color:var(--attention)}.card.warning{border-left-color:var(--warning)}
.card.abnormal{border-left-color:var(--abnormal);box-shadow:0 0 15px #ff536421}.card.offline{border-left-color:var(--offline);opacity:.7}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.area{font-size:16px;font-weight:700}.sub{font-size:10px;color:#668ca5;margin-top:2px}
.risk{font-size:20px;font-weight:800}.risk small{font-size:10px;color:#8ea8ba}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.metric{background:#071421b8;border:1px solid #163b51;border-radius:5px;padding:6px}.m-top{display:flex;justify-content:space-between;gap:5px;color:#85a9bd;font-size:10px}
.value{font-size:17px;font-weight:700;margin:3px 0}.limit{font-size:9px;color:#668ba2}.trend{font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:8px}.badge{padding:3px 6px;border-radius:10px;font-size:9px;font-weight:700;border:1px solid currentColor}
.reason{font-size:10px;color:#d9b97c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.normalC{color:var(--normal)}.attentionC{color:var(--attention)}.warningC{color:var(--warning)}.abnormalC{color:var(--abnormal)}.offlineC{color:var(--offline)}
.side{display:flex;flex-direction:column;gap:9px}.panel{background:#091827;border:1px solid #19445e;border-radius:7px;padding:10px;overflow:hidden}
.panel h3{font-size:13px;margin:0 0 8px;color:#9edfff}.alerts{max-height:390px;overflow:auto}.alert{border-left:3px solid var(--warning);background:#0b2031;margin-bottom:6px;padding:7px;border-radius:3px}
.alert.abnormal{border-left-color:var(--abnormal)}.alert.attention{border-left-color:var(--attention)}.alert-top{display:flex;justify-content:space-between;font-size:10px;color:#83a6ba}
.alert strong{font-size:12px}.alert p{font-size:10px;margin:4px 0;color:#b8d1df}.rank{display:grid;grid-template-columns:22px 1fr 80px 32px;gap:5px;align-items:center;margin:7px 0;font-size:11px}
.bar{height:5px;background:#173247;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--normal),var(--warning),var(--abnormal))}
.matrix{width:100%;border-collapse:collapse;font-size:10px}.matrix th,.matrix td{padding:5px;text-align:center;border-bottom:1px solid #153448}.matrix th:first-child,.matrix td:first-child{text-align:left}
.dot{font-size:15px}.tabs{display:flex;gap:6px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#020811dd;display:none;align-items:center;justify-content:center;z-index:20;padding:25px}.modal.open{display:flex}
.modal-box{width:min(1280px,96vw);max-height:92vh;overflow:auto;background:#081725;border:1px solid #276685;border-radius:8px;padding:15px;box-shadow:0 0 50px #000}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{font-size:22px;background:none;border:0;color:#9fc8db;cursor:pointer}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.chartbox{background:#06111c;border:1px solid #183b50;padding:9px;border-radius:6px}
.chartbox canvas{width:100%;height:180px}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;color:#8baabd;font-size:10px;margin-bottom:4px}
.field input{width:100%;background:#06131f;border:1px solid #23506b;color:white;padding:7px;border-radius:4px}
.note{font-size:10px;color:#7897aa;margin-top:8px}.legend{display:flex;gap:10px;font-size:9px;color:#8daabd}
@media(max-width:1250px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.grid,.detail-grid,.side{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.settings{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand" data-i="title">环境监控中心<small>PROCESS ENVIRONMENTAL MONITORING · SPC EARLY WARNING</small></div>
<div class="controls"><span class="clock" id="clock"></span><button class="btn active" id="zhBtn">中文</button><button class="btn" id="enBtn">English</button><button class="btn" id="settingsBtn">⚙ <span data-i="settings">工程设置</span></button></div></header>
<div class="kpis" id="kpis"></div>
<div class="layout">
<main><div class="section-title" data-i="areaStatus">区域实时状态 / Area Real-time Status</div><div class="grid" id="cards"></div></main>
<aside class="side">
<section class="panel"><h3 data-i="alerts">实时预警 / Real-time Alerts</h3><div class="alerts" id="alerts"></div></section>
<section class="panel"><h3 data-i="ranking">异常风险排行 / Anomaly Risk Ranking</h3><div id="ranking"></div></section>
<section class="panel"><h3 data-i="matrix">过程健康矩阵 / Process Health Matrix</h3><div id="matrix"></div><div class="legend"><span class="normalC">● Normal</span><span class="attentionC">▲ Attention/Warning</span><span class="abnormalC">■ Abnormal</span></div></section>
</aside></div>
</div>
<div class="modal" id="detailModal"><div class="modal-box"><div class="modal-head"><div><h2 id="detailTitle"></h2><div id="detailStatus"></div></div><button class="close" data-close="detailModal">×</button></div>
<div class="tabs"><button class="btn active">1H</button><button class="btn">8H</button><button class="btn">24H</button><button class="btn">7D</button></div><div class="detail-grid" id="charts"></div></div></div>
<div class="modal" id="settingsModal"><div class="modal-box"><div class="modal-head"><h2 data-i="settings">工程设置</h2><button class="close" data-close="settingsModal">×</button></div>
<div class="settings" id="settingsForm"></div><p class="note" data-i="settingsNote">演示版：设置将直接应用于前端分析逻辑。实际系统中应由受控配置/MES/SCADA提供。</p>
<button class="btn" id="applySettings" data-i="apply">应用设置</button></div></div>
<script>
/* ========================= CENTRAL CONFIG =========================
   In production, limits should be supplied by controlled configuration,
   MES/SCADA or a validated recipe, not copied from demo values. */
const CONFIG={
 limits:{temp:{min:18,max:30,unit:"°C"},humidity:{min:0,max:20,unit:"%"},p05:{min:0,max:100000,unit:"PCS/FT³"},p50:{min:0,max:832,unit:"PCS/FT³"}},
 warningZone:.15, trendCount:6, sideCount:8, movingWindow:6,
 roc:{temp:.65,humidity:2.5,p05:12000,p50:100},
 score:{attention:30,warning:50,abnormal:70}, refreshMs:5000
};
const I18N={
 zh:{title:"环境监控中心",settings:"工程设置",areaStatus:"区域实时状态 / Area Real-time Status",alerts:"实时预警 / Real-time Alerts",ranking:"异常风险排行 / Anomaly Risk Ranking",matrix:"过程健康矩阵 / Process Health Matrix",total:"监控区域",normal:"正常",attention:"注意",warning:"预警",abnormal:"异常",early:"限内预警",within:"管理限内",out:"超出管理限",risk:"异常风险",temp:"温度",humidity:"湿度",p05:"0.5μm粒子",p50:"5.0μm粒子",limit:"管理限",stable:"稳定",rise:"连续上升",fall:"连续下降",shift:"平均值偏移",near:"接近管理限",roc:"变化率异常",variance:"波动性增加",spike:"粒子数快速增加",side:"连续位于中心线同侧",offline:"传感器离线",noData:"无数据",earlyMsg:"当前值未超出管理限，但检测到异常趋势。",checkHVAC:"请确认空调及气流状态",checkParticle:"请确认洁净设备、人员活动及过滤系统",checkSensor:"请确认传感器通讯及供电",apply:"应用设置",settingsNote:"演示版：设置将直接应用于前端分析逻辑。实际系统中应由受控配置/MES/SCADA提供。"},
 en:{title:"Environmental Monitoring Center",settings:"Engineer Settings",areaStatus:"Area Real-time Status",alerts:"Real-time Alerts",ranking:"Anomaly Risk Ranking",matrix:"Process Health Matrix",total:"Total Areas",normal:"Normal",attention:"Attention",warning:"Warning",abnormal:"Abnormal",early:"Within Limit Warning",within:"Within Limit",out:"Out of Limit",risk:"Anomaly Risk",temp:"Temperature",humidity:"Humidity",p05:"0.5μm Particles",p50:"5.0μm Particles",limit:"Limit",stable:"Stable",rise:"Continuous Rise",fall:"Continuous Fall",shift:"Mean Shift",near:"Near Control Limit",roc:"Abnormal Rate of Change",variance:"Increasing Variability",spike:"Rapid Particle Increase",side:"Consecutive Points on One Side",offline:"Sensor Offline",noData:"No Data",earlyMsg:"Within management limits, but abnormal trend detected.",checkHVAC:"Check HVAC / airflow condition",checkParticle:"Check clean equipment, personnel activity and filtration",checkSensor:"Check sensor communication and power",apply:"Apply Settings",settingsNote:"Demo: settings apply directly to front-end analysis. Production limits should come from controlled MES/SCADA configuration."}
}; let lang="zh"; const T=k=>I18N[lang][k]||k;
const METRICS=["temp","humidity","p05","p50"];
const scenarios=["stable","rise","near","spike","p50rise","shift","variance","out","offline","stable","rise","side","near","spike","stable"];
function rnd(a,b){return a+Math.random()*(b-a)} function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}
function std(a){let m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))}
function series(base,noise,n=30){let a=[];for(let i=0;i<n;i++)a.push(base+rnd(-noise,noise));return a}
function makeArea(i,scenario){
 let d={id:`B3-1F${String(i+1).padStart(3,"0")}`,scenario,offline:scenario==="offline",hist:{}};
 d.hist.temp=series(22.4,.18); d.hist.humidity=series(5.2,.35); d.hist.p05=series(3500,700); d.hist.p50=series(45,15);
 if(scenario==="rise") for(let j=20;j<30;j++)d.hist.temp[j]=21.3+(j-20)*.31+rnd(-.03,.03);
 if(scenario==="near") for(let j=20;j<30;j++)d.hist.humidity[j]=14+(j-20)*.55+rnd(-.2,.2);
 if(scenario==="spike"){d.hist.p05[28]=18000;d.hist.p05[29]=31000}
 if(scenario==="p50rise")for(let j=21;j<30;j++)d.hist.p50[j]=80+(j-21)*35+rnd(-5,5);
 if(scenario==="shift")for(let j=20;j<30;j++)d.hist.temp[j]=24.6+rnd(-.12,.12);
 if(scenario==="variance")for(let j=20;j<30;j++)d.hist.humidity[j]=5+rnd(-3.4,3.4);
 if(scenario==="out")d.hist.temp[29]=30.8;
 if(scenario==="side")for(let j=21;j<30;j++)d.hist.temp[j]=23.5+rnd(.05,.3);
 if(d.offline) METRICS.forEach(k=>d.hist[k]=[]);
 return d;
}
let areas=scenarios.map((s,i)=>makeArea(i,s));
function limitCheck(v,k){let l=CONFIG.limits[k];return v>=l.min&&v<=l.max}
function analyzeMetric(arr,k){
 if(!arr.length)return {status:"offline",score:0,reasons:["offline"],current:null,within:false,roc:0};
 let l=CONFIG.limits[k],cur=arr.at(-1),within=limitCheck(cur,k),reasons=[],score=0,range=l.max-l.min||l.max;
 if(!within){reasons.push("out");score=100}
 let tc=Math.min(CONFIG.trendCount,arr.length),tail=arr.slice(-tc);
 let inc=tail.every((v,i)=>i===0||v>tail[i-1]),dec=tail.every((v,i)=>i===0||v<tail[i-1]);
 if(inc){reasons.push("rise");score+=25} if(dec){reasons.push("fall");score+=18}
 let roc=arr.length>1?cur-arr.at(-2):0;if(Math.abs(roc)>CONFIG.roc[k]){reasons.push("roc");score+=22}
 let base=arr.slice(0,Math.max(10,arr.length-CONFIG.movingWindow)),m=avg(base),sd=Math.max(std(base),range*.005);
 let recent=arr.slice(-CONFIG.movingWindow);if(Math.abs(avg(recent)-m)>2.2*sd){reasons.push("shift");score+=20}
 if(std(recent)>Math.max(sd*2,range*.03)){reasons.push("variance");score+=15}
 let side=arr.slice(-CONFIG.sideCount);if(side.length>=CONFIG.sideCount&&(side.every(v=>v>m)||side.every(v=>v<m))){reasons.push("side");score+=15}
 let dist=Math.min((cur-l.min)/range,(l.max-cur)/range);if(within&&dist<CONFIG.warningZone){reasons.push("near");score+=18}
 if((k==="p05"||k==="p50")&&arr.length>5&&cur>avg(arr.slice(-6,-1))*1.8){reasons.push("spike");score+=25}
 score=Math.min(100,score); let status=!within?"abnormal":score>=CONFIG.score.warning?"warning":score>=CONFIG.score.attention?"attention":"normal";
 return {status,score,reasons:[...new Set(reasons)],current:cur,within,roc,mean:m};
}
function analyzeArea(a){
 if(a.offline)return {...a,status:"offline",risk:0,metrics:Object.fromEntries(METRICS.map(k=>[k,analyzeMetric([],k)])),reason:"offline"};
 let metrics={};METRICS.forEach(k=>metrics[k]=analyzeMetric(a.hist[k],k));
 let order={normal:0,attention:1,warning:2,abnormal:3};let worst=METRICS.map(k=>metrics[k]).sort((x,y)=>order[y.status]-order[x.status]||y.score-x.score)[0];
 let status=worst.status,risk=Math.max(...METRICS.map(k=>metrics[k].score));return {...a,metrics,status,risk,reason:worst.reasons[0]||"stable"};
}
function fmt(v,k){if(v==null)return "—";return (k==="p05"||k==="p50")?Math.round(v).toLocaleString():v.toFixed(2)}
function lim(k){let l=CONFIG.limits[k];return l.min===0?`≤ ${l.max.toLocaleString()}`:`${l.min}–${l.max}`}
function render(){
 let A=areas.map(analyzeArea), counts={normal:0,attention:0,warning:0,abnormal:0,offline:0};A.forEach(a=>counts[a.status]++);
 let early=A.filter(a=>a.status==="warning"&&METRICS.every(k=>a.metrics[k].within)).length;
 document.getElementById("kpis").innerHTML=[
  ["",T("total"),A.length],["normal",T("normal"),counts.normal],["attention",T("attention"),counts.attention],["warning",T("warning"),counts.warning],["abnormal",T("abnormal"),counts.abnormal],["early",T("early"),early]
 ].map(x=>`<div class="kpi ${x[0]}"><div class="label">${x[1]}</div><div class="num">${x[2]}</div></div>`).join("");
 document.getElementById("cards").innerHTML=A.map(a=>`<article class="card ${a.status}" onclick="openDetail('${a.id}')">
 <div class="card-head"><div><div class="area">${a.id}</div><div class="sub">生产环境监控 · PRODUCTION ENVIRONMENT</div></div><div class="risk ${a.status}C">${a.risk}<small>/100</small></div></div>
 <div class="metric-grid">${METRICS.map(k=>{let m=a.metrics[k];return `<div class="metric"><div class="m-top"><span>${T(k)}</span><span class="${m.status}C">${m.status==="offline"?T("offline"):(m.within?T("within"):T("out"))}</span></div>
 <div class="value">${fmt(m.current,k)} <small>${CONFIG.limits[k].unit}</small></div><div class="limit">${T("limit")}: ${lim(k)}</div>
 <div class="trend ${m.status}C">${m.reasons[0]?T(m.reasons[0]):T("stable")}${m.roc?` · ${m.roc>0?"↑":"↓"} ${Math.abs(m.roc).toFixed(k[0]==="p"?0:2)}`:""}</div></div>`}).join("")}</div>
 <div class="status-row"><span class="badge ${a.status}C">${T(a.status)}</span><span class="reason">${T(a.reason)}</span></div></article>`).join("");
 let alerts=A.filter(a=>["attention","warning","abnormal"].includes(a.status)).sort((a,b)=>b.risk-a.risk);
 document.getElementById("alerts").innerHTML=alerts.map(a=>{let k=METRICS.sort((x,y)=>a.metrics[y].score-a.metrics[x].score)[0],m=a.metrics[k];
 return `<div class="alert ${a.status}"><div class="alert-top"><span>${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} · ${a.id}</span><span class="${a.status}C">${T(a.status)}</span></div>
 <strong>${T(k)} · ${fmt(m.current,k)} ${CONFIG.limits[k].unit}</strong><p>${T(m.reasons[0]||"stable")} · ${T("limit")}: ${lim(k)}</p><p>${k==="temp"||k==="humidity"?T("checkHVAC"):T("checkParticle")}</p></div>`}).join("")||"—";
 document.getElementById("ranking").innerHTML=A.filter(a=>!a.offline).sort((a,b)=>b.risk-a.risk).slice(0,7).map((a,i)=>`<div class="rank"><b>${i+1}</b><span>${a.id}</span><div class="bar"><i style="width:${a.risk}%"></i></div><b class="${a.status}C">${a.risk}</b></div>`).join("");
 document.getElementById("matrix").innerHTML=`<table class="matrix"><tr><th>AREA</th>${METRICS.map(k=>`<th>${k==="temp"?"TEMP":k==="humidity"?"RH":k==="p05"?"0.5μm":"5.0μm"}</th>`).join("")}</tr>
 ${A.map(a=>`<tr><td>${a.id}</td>${METRICS.map(k=>{let s=a.metrics[k].status,ch=s==="abnormal"?"■":(s==="attention"||s==="warning")?"▲":s==="offline"?"×":"●";return `<td class="dot ${s}C">${ch}</td>`}).join("")}</tr>`).join("")}</table>`;
 document.querySelectorAll("[data-i]").forEach(e=>e.childNodes[0].nodeValue=T(e.dataset.i));
}
function drawChart(canvas,arr,k){
 let c=canvas.getContext("2d"),w=canvas.width=canvas.clientWidth*2,h=canvas.height=360;c.scale(2,2);w/=2;h/=2;c.clearRect(0,0,w,h);
 if(!arr.length){c.fillStyle="#718096";c.fillText(T("noData"),20,30);return}
 let l=CONFIG.limits[k],mn=Math.min(...arr,l.min),mx=Math.max(...arr,l.max),pad=(mx-mn)*.12||1;mn-=pad;mx+=pad;
 let X=i=>12+i*(w-24)/(arr.length-1),Y=v=>h-16-(v-mn)*(h-30)/(mx-mn);
 c.strokeStyle="#173b50";c.lineWidth=1;for(let j=0;j<5;j++){let y=10+j*(h-25)/4;c.beginPath();c.moveTo(10,y);c.lineTo(w-10,y);c.stroke()}
 [l.min,l.max].forEach(v=>{c.strokeStyle="#ff5364";c.setLineDash([5,4]);c.beginPath();c.moveTo(10,Y(v));c.lineTo(w-10,Y(v));c.stroke();c.setLineDash([])});
 let m=avg(arr);c.strokeStyle="#67879a";c.setLineDash([3,3]);c.beginPath();c.moveTo(10,Y(m));c.lineTo(w-10,Y(m));c.stroke();c.setLineDash([]);
 c.strokeStyle="#4fc8ff";c.lineWidth=2;c.beginPath();arr.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();
 arr.forEach((v,i)=>{if(!limitCheck(v,k)){c.fillStyle="#ff5364";c.beginPath();c.arc(X(i),Y(v),3,0,Math.PI*2);c.fill()}});
}
function openDetail(id){let a=analyzeArea(areas.find(x=>x.id===id));document.getElementById("detailTitle").textContent=`${a.id} · ${T("risk")} ${a.risk}/100`;
 document.getElementById("detailStatus").innerHTML=`<span class="badge ${a.status}C">${T(a.status)}</span> &nbsp; ${a.status==="warning"?T("earlyMsg"):T(a.reason)}`;
 let ch=document.getElementById("charts");ch.innerHTML=METRICS.map(k=>`<div class="chartbox"><b>${T(k)}</b><div class="${a.metrics[k].status}C" style="float:right">${fmt(a.metrics[k].current,k)} ${CONFIG.limits[k].unit}</div><canvas id="ch_${k}"></canvas></div>`).join("");
 document.getElementById("detailModal").classList.add("open");requestAnimationFrame(()=>METRICS.forEach(k=>drawChart(document.getElementById("ch_"+k),a.hist[k],k)));
}
function settingsUI(){let defs=[["tempMin","Temperature min",CONFIG.limits.temp.min],["tempMax","Temperature max",CONFIG.limits.temp.max],["humidityMax","Humidity max",CONFIG.limits.humidity.max],["p05Max","0.5μm max",CONFIG.limits.p05.max],["p50Max","5.0μm max",CONFIG.limits.p50.max],["warningZone","Warning zone %",CONFIG.warningZone*100],["trendCount","Trend points",CONFIG.trendCount],["movingWindow","Moving average window",CONFIG.movingWindow],["attScore","Attention score",CONFIG.score.attention],["warnScore","Warning score",CONFIG.score.warning],["refresh","Refresh ms",CONFIG.refreshMs]];
 document.getElementById("settingsForm").innerHTML=defs.map(d=>`<div class="field"><label>${d[1]}</label><input id="s_${d[0]}" type="number" value="${d[2]}"></div>`).join("");
}
document.getElementById("settingsBtn").onclick=()=>{settingsUI();document.getElementById("settingsModal").classList.add("open")}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove("open"));
document.getElementById("applySettings").onclick=()=>{let g=id=>+document.getElementById("s_"+id).value;CONFIG.limits.temp.min=g("tempMin");CONFIG.limits.temp.max=g("tempMax");CONFIG.limits.humidity.max=g("humidityMax");CONFIG.limits.p05.max=g("p05Max");CONFIG.limits.p50.max=g("p50Max");CONFIG.warningZone=g("warningZone")/100;CONFIG.trendCount=g("trendCount");CONFIG.movingWindow=g("movingWindow");CONFIG.score.attention=g("attScore");CONFIG.score.warning=g("warnScore");CONFIG.refreshMs=g("refresh");document.getElementById("settingsModal").classList.remove("open");render()}
function setLang(x){lang=x;document.documentElement.lang=x==="zh"?"zh-CN":"en";document.getElementById("zhBtn").classList.toggle("active",x==="zh");document.getElementById("enBtn").classList.toggle("active",x==="en");render()}
document.getElementById("zhBtn").onclick=()=>setLang("zh");document.getElementById("enBtn").onclick=()=>setLang("en");
setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleString(lang==="zh"?"zh-CN":"en-GB",{hour12:false}),1000);

function acquireMockData(){areas.forEach(a=>{if(a.offline)return;METRICS.forEach(k=>{let h=a.hist[k],last=h.at(-1),noise=k==="temp"?.05:k==="humidity"?.12:k==="p05"?180:5;h.push(last+rnd(-noise,noise));h.shift()})})}
render();setInterval(()=>{acquireMockData();render()},CONFIG.refreshMs);
